<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkMind | Connection</title>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        :root { --accent: #00f2fe; --bg: #000000; --card: #121212; --text: #fafafa; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        
        /* Centered Login Container */
        .auth-container { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .auth-card { background: var(--card); border: 1px solid #333; width: 100%; max-width: 350px; padding: 40px; border-radius: 1px; text-align: center; }
        .auth-card h1 { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 2.5rem; margin-bottom: 30px; background: linear-gradient(to right, #00f2fe, #4facfe); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        input { width: 100%; background: #1a1a1a; border: 1px solid #333; padding: 12px; margin-bottom: 10px; border-radius: 5px; color: white; box-sizing: border-box; font-size: 0.9rem; }
        input:focus { border-color: #555; outline: none; }
        
        .main-btn { width: 100%; background: var(--accent); color: black; border: none; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .switch-btn { margin-top: 20px; font-size: 0.9rem; color: #a8a8a8; cursor: pointer; }
        .switch-btn span { color: var(--accent); font-weight: bold; }

        /* App UI Layout */
        #appUI { display: none; }
        .nav { position: sticky; top: 0; background: black; border-bottom: 1px solid #262626; display: flex; justify-content: space-between; padding: 10px 20px; align-items: center; z-index: 100; }
        .feed-container { max-width: 500px; margin: 0 auto; padding-top: 20px; }
        
        .post-card { border-bottom: 1px solid #262626; padding: 15px 0; }
        .post-header { display: flex; align-items: center; gap: 10px; padding-bottom: 10px; }
        .post-avatar { width: 32px; height: 32px; background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); border-radius: 50%; }
        .post-content img { width: 100%; border-radius: 3px; margin-top: 10px; }
        
        .actions { display: flex; gap: 15px; padding-top: 10px; font-size: 1.5rem; }
        .actions i { cursor: pointer; transition: 0.2s; }
        .actions i:hover { color: #8e8e8e; }
    </style>
</head>
<body>

    <div id="authUI" class="auth-container">
        <div class="auth-card">
            <h1>LinkMind</h1>
            
            <div id="loginFields">
                <input type="email" id="loginEmail" placeholder="Email">
                <input type="password" id="loginPass" placeholder="Password">
                <button class="main-btn" onclick="login()">Log In</button>
                <div class="switch-btn" onclick="toggleAuth(true)">Don't have an account? <span>Sign Up</span></div>
            </div>

            <div id="signupFields" style="display: none;">
                <input type="text" id="signName" placeholder="Full Name">
                <input type="text" id="signPhone" placeholder="Phone Number">
                <input type="email" id="signEmail" placeholder="Email">
                <input type="password" id="signPass" placeholder="Password">
                <button class="main-btn" onclick="signup()">Sign Up</button>
                <div class="switch-btn" onclick="toggleAuth(false)">Have an account? <span>Log In</span></div>
            </div>
        </div>
    </div>

    <div id="appUI">
        <nav class="nav">
            <h2 style="font-size: 1.5rem; margin: 0;">LinkMind</h2>
            <div style="display: flex; gap: 20px; font-size: 1.5rem;">
                <i class="ph ph-plus-square" onclick="togglePostBox()"></i>
                <i class="ph ph-gear"></i>
            </div>
        </nav>

        <div class="feed-container">
            <div id="postBox" style="display:none; padding: 20px; border-bottom: 1px solid #262626;">
                <textarea id="thoughtInput" placeholder="Write a caption..." style="width:100%; background:none; border:none; color:white; font-size:1rem; outline:none;"></textarea>
                <button class="main-btn" onclick="shareThought()">Share</button>
            </div>

            <div id="globalFeed"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, updateProfile } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBB6h1o-UQJ6lZBCmccteARly_mF79Rb5Q",
            authDomain: "linkmind-36c04.firebaseapp.com",
            projectId: "linkmind-36c04",
            storageBucket: "linkmind-36c04.firebasestorage.app",
            messagingSenderId: "780449443808",
            appId: "1:780449443808:web:1989f9a1d6810e2f3d4585"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // --- NAVIGATION LOGIC ---
        window.toggleAuth = (isSignup) => {
            document.getElementById('loginFields').style.display = isSignup ? 'none' : 'block';
            document.getElementById('signupFields').style.display = isSignup ? 'block' : 'none';
        };

        window.togglePostBox = () => {
            const box = document.getElementById('postBox');
            box.style.display = box.style.display === 'none' ? 'block' : 'none';
        };

        // --- AUTH ACTIONS ---
        window.signup = async () => {
            const email = document.getElementById('signEmail').value;
            const pass = document.getElementById('signPass').value;
            const name = document.getElementById('signName').value;
            try {
                const res = await createUserWithEmailAndPassword(auth, email, pass);
                await updateProfile(res.user, { displayName: name });
                location.reload();
            } catch (e) { alert(e.message); }
        };

        window.login = async () => {
            const email = document.getElementById('loginEmail').value;
            const pass = document.getElementById('loginPass').value;
            try { await signInWithEmailAndPassword(auth, email, pass); } catch (e) { alert(e.message); }
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('authUI').style.display = 'none';
                document.getElementById('appUI').style.display = 'block';
            }
        });

        // --- FEED LOGIC ---
        window.shareThought = async () => {
            const text = document.getElementById('thoughtInput').value;
            await addDoc(collection(db, "posts"), {
                content: text,
                author: auth.currentUser.displayName,
                timestamp: serverTimestamp()
            });
            togglePostBox();
            document.getElementById('thoughtInput').value = "";
        };

        const q = query(collection(db, "posts"), orderBy("timestamp", "desc"));
        onSnapshot(q, (snapshot) => {
            const feed = document.getElementById('globalFeed');
            feed.innerHTML = "";
            snapshot.forEach(doc => {
                const d = doc.data();
                const post = document.createElement('div');
                post.className = 'post-card';
                post.innerHTML = `
                    <div class="post-header"><div class="post-avatar"></div><strong>${d.author}</strong></div>
                    <div class="post-content">${d.content}</div>
                    <div class="actions"><i class="ph ph-heart"></i><i class="ph ph-chat-circle"></i><i class="ph ph-paper-plane-tilt"></i></div>
                `;
                feed.appendChild(post);
            });
        });
    </script>
</body>
</html>
