<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkMind | Live Feed</title>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <script type="module">
        // 1. Loading the Firebase 'Brain'
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // 2. YOUR REAL KEYS
        const firebaseConfig = {
            apiKey: "AIzaSyBB6h1o-UQJ6lZBCmccteARly_mF79Rb5Q",
            authDomain: "linkmind-36c04.firebaseapp.com",
            projectId: "linkmind-36c04",
            storageBucket: "linkmind-36c04.firebasestorage.app",
            messagingSenderId: "780449443808",
            appId: "1:780449443808:web:1989f9a1d6810e2f3d4585"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 3. Sharing to the Cloud
        window.shareThought = async () => {
            const text = document.getElementById('thoughtInput').value;
            if (!text.trim()) return;

            await addDoc(collection(db, "posts"), {
                content: text,
                timestamp: serverTimestamp(),
                author: "LinkMind Member"
            });
            document.getElementById('thoughtInput').value = "";
        };

        // 4. Listening for anyone else's posts
        const q = query(collection(db, "posts"), orderBy("timestamp", "desc"));
        onSnapshot(q, (snapshot) => {
            const feed = document.getElementById('globalFeed');
            feed.innerHTML = ""; 
            snapshot.forEach((doc) => {
                const data = doc.data();
                const div = document.createElement('div');
                div.className = 'post-card';
                div.innerHTML = `<strong>Explorer</strong><p>${data.content}</p>`;
                feed.appendChild(div);
            });
        });
    </script>

    <style>
        body { background: #000; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; }
        .container { width: 90%; max-width: 500px; margin-top: 30px; }
        .input-box { background: #111; padding: 20px; border-radius: 20px; border: 1px solid #333; margin-bottom: 20px; }
        textarea { width: 100%; background: transparent; border: none; color: white; font-size: 1.1rem; outline: none; resize: none; }
        .post-card { background: #111; padding: 20px; border-radius: 20px; margin-bottom: 10px; border: 1px solid #222; animation: slideIn 0.3s ease; }
        .btn { background: #00f2fe; border: none; padding: 10px 20px; border-radius: 50px; font-weight: bold; cursor: pointer; float: right; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; } }
    </style>
</head>
<body>
    <div class="container">
        <h2>LinkMind Global</h2>
        <div class="input-box">
            <textarea id="thoughtInput" placeholder="Send a message to everyone..."></textarea>
            <button class="btn" onclick="shareThought()">Broadcast</button>
            <div style="clear:both;"></div>
        </div>
        <div id="globalFeed"></div>
    </div>
</body>
</html>
