<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkMind | The Future</title>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body {
            margin: 0; height: 100vh;
            background: radial-gradient(circle at top right, #1e293b, #000000);
            display: flex; align-items: center; justify-content: center;
            font-family: 'Segoe UI', sans-serif; overflow: hidden;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 3rem; border-radius: 50px;
            text-align: center; box-shadow: 0 0 80px rgba(0, 212, 255, 0.1);
            max-width: 450px; animation: float 5s ease-in-out infinite;
        }
        h1 {
            font-size: 3.5rem; margin: 0;
            background: linear-gradient(to bottom right, #00f2fe, #4facfe);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            letter-spacing: -2px;
        }
        p { color: #94a3b8; font-size: 1.1rem; margin-top: 15px; }
        .btn {
            margin-top: 30px; padding: 15px 40px;
            background: linear-gradient(90deg, #00f2fe, #4facfe);
            border: none; border-radius: 100px;
            color: white; font-weight: bold; cursor: pointer;
        }
        .join-box {
            margin-top: 30px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 20px;
        }
        input {
            padding: 10px; border-radius: 5px; border: none; width: 180px; background: rgba(255,255,255,0.1); color: white;
        }
    </style>
</head>
<body>
    <div class="glass-card">
        <i class="ph ph-brain" style="font-size: 60px; color: #00f2fe; margin-bottom: 10px;"></i>
        <h1>LinkMind</h1>
        <p>A connection deeper than social media.</p>
        <a href="about.html"><button class="btn">Explore the Vision</button></a>
        
        <div class="join-box">
            <p style="font-size: 0.8rem;">Join the Private Beta</p>
            <input type="email" placeholder="email@example.com">
            <button style="padding: 10px; border-radius: 5px; border: none; background: #00f2fe; font-weight: bold; cursor: pointer;">Join</button>
        </div>
    </div>
</body>
</html>
