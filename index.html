<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkMind | The Future</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            background: radial-gradient(circle at top right, #1e293b, #000000);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
        }
        /* The Glass Card */
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 4rem;
            border-radius: 50px;
            text-align: center;
            box-shadow: 0 0 80px rgba(0, 212, 255, 0.1);
            max-width: 450px;
        }
        h1 {
            font-size: 4rem;
            margin: 0;
            background: linear-gradient(to bottom right, #00f2fe, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -2px;
        }
        p {
            color: #94a3b8;
            font-size: 1.2rem;
            line-height: 1.6;
            margin-top: 20px;
        }
        .btn {
            margin-top: 40px;
            padding: 18px 45px;
            background: linear-gradient(90deg, #00f2fe, #4facfe);
            border: none;
            border-radius: 100px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.4s ease;
        }
        .btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0, 242, 254, 0.5);
        } 
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .glass-card {
            animation: float 5s ease-in-out infinite;
        }
    </style>
</head>
<body>
    <div class="glass-card">
        <h1>LinkMind</h1>
        <p>A connection deeper than social media. The future of the digital mind.</p>
        <a href="about.html"><button class="btn">Explore the Mind</button></a> 
        <div style="margin-top: 30px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 20px;">
    <p style="font-size: 0.9rem;">Join the LinkMind Private Beta</p>
    <input type="email" placeholder="Enter your email" style="padding: 10px; border-radius: 5px; border: none; width: 200px;">
    <button style="padding: 10px; border-radius: 5px; border: none; background: #00f2fe; color: black; font-weight: bold; cursor: pointer;">Join</button>
</div>
    </div>
</body>
</html>
